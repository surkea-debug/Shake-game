<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Snake</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1 class="title">SNAKE</h1>
            <div class="score-board">
                <div class="score-box">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">HIGH SCORE</span>
                    <span id="high-score" class="value">0</span>
                </div>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="start-screen" class="overlay">
                <h2>NEON SNAKE</h2>
                <p>Use Arrow Keys or On-Screen Controls</p>
                <div class="difficulty-select">
                    <button class="diff-btn" data-speed="140">EASY</button>
                    <button class="diff-btn active" data-speed="100">MEDIUM</button>
                    <button class="diff-btn" data-speed="60">HARD</button>
                </div>
                <button id="start-btn" class="main-btn">START GAME</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h2>GAME OVER</h2>
                <p class="final-score-text">FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn" class="main-btn">PLAY AGAIN</button>
            </div>
        </div>

        <div class="controls">
            <div class="d-pad">
                <button id="btn-up" class="pad-btn up">▲</button>
                <div class="horizontal-btns">
                    <button id="btn-left" class="pad-btn left">◄</button>
                    <button id="btn-right" class="pad-btn right">►</button>
                </div>
                <button id="btn-down" class="pad-btn down">▼</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
