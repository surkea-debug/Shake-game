<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcade Snake</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #080711;
            color: #e0e6ed;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Glow Effects */
        .glow-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.4);
        }
        
        .glow-magenta {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.7), 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .box-glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.35), inset 0 0 15px rgba(6, 182, 212, 0.2);
            border: 1px solid rgba(6, 182, 212, 0.6);
        }

        .box-glow-magenta {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.35), inset 0 0 15px rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.6);
        }

        .arcade-btn {
            transition: all 0.15s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        
        .arcade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
        }

        .arcade-btn:active {
            transform: translateY(1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080711;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        /* Canvas Outer Border Glow */
        .canvas-container {
            position: relative;
            background: radial-gradient(circle at center, #0f172a 0%, #05050c 100%);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
        }

        /* D-Pad Button Styling for Mobile */
        .dpad-btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn:active {
            background: rgba(6, 182, 212, 0.4);
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-2 sm:p-4">

    <!-- Header & Scoreboard Section -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center gap-3 my-2 z-10">
        <div class="flex items-center gap-3">
            <i class="fa-solid font-orbitron fa-staff-snake text-3xl text-cyan-400 animate-pulse"></i>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-500 glow-cyan">
                    NEON SNAKE
                </h1>
                <p class="text-xs text-slate-400 tracking-widest uppercase">Cyber Arcade Edition</p>
            </div>
        </div>

        <!-- Scores Display -->
        <div class="flex gap-4 sm:gap-6 items-center">
            <div class="bg-slate-900/80 px-4 py-2 rounded-xl box-glow-cyan text-center min-w-[100px]">
                <div class="text-xs text-cyan-400 uppercase font-bold tracking-wider">Score</div>
                <div id="score" class="text-2xl font-orbitron font-extrabold text-white">0</div>
            </div>
            <div class="bg-slate-900/80 px-4 py-2 rounded-xl box-glow-magenta text-center min-w-[100px]">
                <div class="text-xs text-pink-400 uppercase font-bold tracking-wider">High Score</div>
                <div id="highScore" class="text-2xl font-orbitron font-extrabold text-white">0</div>
            </div>
        </div>
    </header>

    <!-- Controls Bar -->
    <section class="w-full max-w-4xl flex flex-wrap justify-between items-center gap-2 mb-2 z-10 px-1">
        <!-- Difficulty Selector -->
        <div class="flex items-center gap-1 sm:gap-2 bg-slate-900/80 p-1 rounded-lg border border-slate-800">
            <span class="text-xs text-slate-400 px-2 font-semibold">SPEED:</span>
            <button id="btnEasy" onclick="setDifficulty('easy')" class="px-3 py-1 text-xs font-bold rounded-md font-orbitron transition-all bg-slate-800 text-slate-300 hover:text-white">EASY</button>
            <button id="btnMedium" onclick="setDifficulty('medium')" class="px-3 py-1 text-xs font-bold rounded-md font-orbitron transition-all bg-cyan-600 text-white shadow-lg shadow-cyan-500/50">MEDIUM</button>
            <button id="btnHard" onclick="setDifficulty('hard')" class="px-3 py-1 text-xs font-bold rounded-md font-orbitron transition-all bg-slate-800 text-slate-300 hover:text-white">HARD</button>
        </div>

        <!-- Utility Action Buttons -->
        <div class="flex items-center gap-2">
            <button id="btnSound" onclick="toggleAudio()" class="arcade-btn px-3 py-1.5 text-xs font-bold font-orbitron bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-lg border border-slate-700 flex items-center gap-2">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                <span id="soundText">AUDIO ON</span>
            </button>

            <button id="btnPause" onclick="togglePause()" class="arcade-btn px-3 py-1.5 text-xs font-bold font-orbitron bg-slate-800 hover:bg-slate-700 text-yellow-400 rounded-lg border border-slate-700 flex items-center gap-2">
                <i id="pauseIcon" class="fa-solid fa-pause"></i>
                <span id="pauseText">PAUSE</span>
            </button>

            <button onclick="resetGame()" class="arcade-btn px-3 py-1.5 text-xs font-bold font-orbitron bg-pink-600 hover:bg-pink-500 text-white rounded-lg shadow-lg shadow-pink-600/40 flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>RESET</span>
            </button>
        </div>
    </section>

    <!-- Main Game Arena -->
    <main class="relative flex-grow flex flex-col justify-center items-center w-full max-w-4xl">
        <div class="canvas-container relative rounded-2xl overflow-hidden border-2 border-cyan-500/40 flex items-center justify-center">
            
            <!-- Game Canvas -->
            <canvas id="gameCanvas" width="600" height="600" class="w-full max-w-[600px] aspect-square block rounded-xl cursor-pointer"></canvas>

            <!-- Overlay for Start / Pause / Game Over Screen -->
            <div id="overlayScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col justify-center items-center p-6 text-center z-20 transition-all duration-300">
                <div id="overlayContent" class="max-w-md w-full flex flex-col items-center">
                    <i id="overlayIcon" class="fa-solid fa-play text-5xl text-cyan-400 mb-4 animate-bounce"></i>
                    <h2 id="overlayTitle" class="text-3xl font-extrabold font-orbitron text-white mb-2 tracking-wider">CYBER SNAKE</h2>
                    <p id="overlaySub" class="text-sm text-slate-300 mb-6 font-medium">Use Arrow keys or WASD to control the snake. Collect glowing energy orbs!</p>
                    
                    <button id="overlayBtn" onclick="handleOverlayClick()" class="arcade-btn w-full py-3.5 px-6 rounded-xl font-orbitron font-extrabold text-base bg-gradient-to-r from-cyan-500 to-pink-500 text-white shadow-lg shadow-cyan-500/40 hover:opacity-95 transition-all">
                        START GAME
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Touch D-Pad Controls -->
    <section class="w-full max-w-xs my-2 flex flex-col items-center md:hidden z-10">
        <div class="grid grid-cols-3 gap-2 w-48 h-48">
            <div></div>
            <button ontouchstart="handleDpadInput('UP')" onclick="handleDpadInput('UP')" class="dpad-btn rounded-xl flex justify-center items-center text-cyan-400 text-2xl active:bg-cyan-500/30">
                <i class="fa-solid fa-caret-up"></i>
            </button>
            <div></div>
            
            <button ontouchstart="handleDpadInput('LEFT')" onclick="handleDpadInput('LEFT')" class="dpad-btn rounded-xl flex justify-center items-center text-cyan-400 text-2xl active:bg-cyan-500/30">
                <i class="fa-solid fa-caret-left"></i>
            </button>
            <div class="flex justify-center items-center">
                <div class="w-3 h-3 rounded-full bg-cyan-500/40 animate-ping"></div>
            </div>
            <button ontouchstart="handleDpadInput('RIGHT')" onclick="handleDpadInput('RIGHT')" class="dpad-btn rounded-xl flex justify-center items-center text-cyan-400 text-2xl active:bg-cyan-500/30">
                <i class="fa-solid fa-caret-right"></i>
            </button>
            
            <div></div>
            <button ontouchstart="handleDpadInput('DOWN')" onclick="handleDpadInput('DOWN')" class="dpad-btn rounded-xl flex justify-center items-center text-cyan-400 text-2xl active:bg-cyan-500/30">
                <i class="fa-solid fa-caret-down"></i>
            </button>
            <div></div>
        </div>
    </section>

    <!-- Footer Instructions -->
    <footer class="text-xs text-slate-500 text-center my-2 font-mono">
        Controls: WASD / Arrow Keys to move &bull; Spacebar to Pause
    </footer>

    <!-- Game Logic Script -->
    <script>
        /**
         * Web Audio API Synthesizer Module
         * Generates retro arcade sound effects dynamically without external assets.
         */
        const AudioSystem = {
            ctx: null,
            enabled: true,

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playEatSound() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            },

            playTurnSound() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.setValueAtTime(300, this.ctx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },

            playGameOverSound() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        };

        // Canvas & Game Parameters
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_COUNT = 20; // 20x20 Grid
        let CELL_SIZE = canvas.width / GRID_COUNT;

        // Difficulty Speed Presets (in milliseconds per frame update)
        const SPEEDS = {
            easy: 120,
            medium: 80,
            hard: 50
        };

        // Game State Variables
        let currentDifficulty = 'medium';
        let gameInterval = null;
        let isRunning = false;
        let isPaused = false;
        let isGameOver = false;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_snake_highscore') || '0', 10);

        // Snake Configuration
        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };

        // Food & Special Item
        let food = { x: 10, y: 10, type: 'normal' };

        // Visual Particles Engine
        let particles = [];

        // Dynamic Food Animation Pulser
        let foodPulse = 0;

        // Sound Toggle state UI setup
        document.getElementById('highScore').innerText = highScore;

        /**
         * Initialize Game Setup and Audio Trigger on interaction
         */
        window.onload = () => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            drawInitialGrid();
        };

        function resizeCanvas() {
            // Keeps grid coordinates sharp based on internal resolution
            canvas.width = 600;
            canvas.height = 600;
            CELL_SIZE = canvas.width / GRID_COUNT;
            if (!isRunning && !isGameOver) {
                drawInitialGrid();
            }
        }

        /**
         * Set Game Speed Difficulty
         */
        function setDifficulty(level) {
            currentDifficulty = level;
            ['btnEasy', 'btnMedium', 'btnHard'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "px-3 py-1 text-xs font-bold rounded-md font-orbitron transition-all bg-slate-800 text-slate-300 hover:text-white";
            });

            const activeBtn = document.getElementById(`btn${level.charAt(0).toUpperCase() + level.slice(1)}`);
            activeBtn.className = "px-3 py-1 text-xs font-bold rounded-md font-orbitron transition-all bg-cyan-600 text-white shadow-lg shadow-cyan-500/50";

            if (isRunning && !isPaused) {
                restartTimer();
            }
        }

        /**
         * Game Reset & Startup Engine
         */
        function startNewGame() {
            AudioSystem.init();
            
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            updateScoreUI();
            
            particles = [];
            spawnFood();

            isRunning = true;
            isPaused = false;
            isGameOver = false;

            hideOverlay();
            restartTimer();
        }

        function restartTimer() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, SPEEDS[currentDifficulty]);
        }

        /**
         * Spawn Food item at random empty grid cell
         */
        function spawnFood() {
            let valid = false;
            while (!valid) {
                const fx = Math.floor(Math.random() * GRID_COUNT);
                const fy = Math.floor(Math.random() * GRID_COUNT);
                
                // Ensure food does not spawn inside snake body
                valid = !snake.some(segment => segment.x === fx && segment.y === fy);
                if (valid) {
                    food = {
                        x: fx,
                        y: fy,
                        type: Math.random() > 0.85 ? 'bonus' : 'normal' // 15% chance for bonus glowing item
                    };
                }
            }
        }

        /**
         * Core Loop Execution
         */
        function gameLoop() {
            updateLogic();
            render();
        }

        /**
         * Movement & Collision Logic Update
         */
        function updateLogic() {
            if (isPaused || isGameOver) return;

            dir = { ...nextDir };
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // Wall Collision Check (Game Over condition)
            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                handleGameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                handleGameOver();
                return;
            }

            // Move Snake Forward
            snake.unshift(head);

            // Food Eating Collision Check
            if (head.x === food.x && head.y === food.y) {
                const points = food.type === 'bonus' ? 30 : 10;
                score += points;
                updateScoreUI();
                
                // Trigger Particles effect & Sound
                createParticles(
                    (food.x + 0.5) * CELL_SIZE, 
                    (food.y + 0.5) * CELL_SIZE, 
                    food.type === 'bonus' ? '#ec4899' : '#06b6d4',
                    18
                );
                AudioSystem.playEatSound();
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            // Update Particle physics
            updateParticles();
        }

        /**
         * Handle Collisions / Game Over
         */
        function handleGameOver() {
            isGameOver = true;
            isRunning = false;
            clearInterval(gameInterval);
            AudioSystem.playGameOverSound();

            // Create explosion particles at Snake Head position
            createParticles(
                (snake[0].x + 0.5) * CELL_SIZE, 
                (snake[0].y + 0.5) * CELL_SIZE, 
                '#ef4444', 
                30
            );

            // Highscore save check
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_snake_highscore', highScore);
                document.getElementById('highScore').innerText = highScore;
            }

            showOverlay('GAME OVER', `Final Score: ${score}`, 'PLAY AGAIN', 'fa-skull-crossbones text-pink-500');
        }

        /**
         * Renderer Module
         */
        function render() {
            // Clear Canvas Background
            ctx.fillStyle = '#080711';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Arcade Grid Background
            drawGrid();

            // Draw Food
            drawFood();

            // Draw Snake
            drawSnake();

            // Draw Visual Particle Explosion System
            drawParticles();
        }

        /**
         * Render Grid Background
         */
        function drawGrid() {
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.lineWidth = 1;

            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        /**
         * Render Snake Body with Neon Gradient & Smooth Rounding
         */
        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const isHead = index === 0;

                ctx.save();

                if (isHead) {
                    // Head Glowing Glow
                    ctx.shadowColor = '#06b6d4';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#22d3ee';
                    
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 8);
                    ctx.fill();

                    // Eyes detail for head
                    ctx.fillStyle = '#080711';
                    const eyeSize = 3;
                    if (dir.x === 1) { // Right
                        ctx.fillRect(x + CELL_SIZE - 8, y + 6, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 8, y + CELL_SIZE - 9, eyeSize, eyeSize);
                    } else if (dir.x === -1) { // Left
                        ctx.fillRect(x + 5, y + 6, eyeSize, eyeSize);
                        ctx.fillRect(x + 5, y + CELL_SIZE - 9, eyeSize, eyeSize);
                    } else if (dir.y === -1) { // Up
                        ctx.fillRect(x + 6, y + 5, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 9, y + 5, eyeSize, eyeSize);
                    } else if (dir.y === 1) { // Down
                        ctx.fillRect(x + 6, y + CELL_SIZE - 8, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 9, y + CELL_SIZE - 8, eyeSize, eyeSize);
                    }
                } else {
                    // Body Segments Fade Cyan Gradient
                    const alpha = Math.max(0.3, 1 - (index / snake.length) * 0.7);
                    ctx.shadowColor = 'rgba(6, 182, 212, 0.4)';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = `rgba(6, 182, 212, ${alpha})`;
                    
                    ctx.beginPath();
                    ctx.roundRect(x + 3, y + 3, CELL_SIZE - 6, CELL_SIZE - 6, 5);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        /**
         * Render Glowing Dynamic Food Items
         */
        function drawFood() {
            foodPulse += 0.08;
            const pulseRadius = (CELL_SIZE / 2 - 4) + Math.sin(foodPulse) * 2;
            const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
            const cy = food.y * CELL_SIZE + CELL_SIZE / 2;

            ctx.save();

            if (food.type === 'bonus') {
                // Magenta Super Orb
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 18;
                ctx.fillStyle = '#f472b6';
                
                ctx.beginPath();
                ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
                ctx.fill();

                // Core Light
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(cx, cy, pulseRadius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Standard Cyan Orb
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#38bdf8';
                
                ctx.beginPath();
                ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
                ctx.fill();

                // Inner Accent Ring
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, pulseRadius * 0.5, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        /**
         * Initial canvas state renderer before start
         */
        function drawInitialGrid() {
            ctx.fillStyle = '#080711';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        /**
         * Particle Physics Subsystem for Eating/Death Explosions
         */
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1.5,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        /**
         * Score UI Updater
         */
        function updateScoreUI() {
            document.getElementById('score').innerText = score;
        }

        /**
         * Overlay Screen Control Handlers
         */
        function showOverlay(title, subtitle, buttonText, iconClass) {
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlaySub').innerText = subtitle;
            document.getElementById('overlayBtn').innerText = buttonText;
            
            const icon = document.getElementById('overlayIcon');
            icon.className = `fa-solid ${iconClass} text-5xl mb-4 animate-bounce`;

            const screen = document.getElementById('overlayScreen');
            screen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            screen.classList.add('flex', 'opacity-100');
        }

        function hideOverlay() {
            const screen = document.getElementById('overlayScreen');
            screen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                screen.classList.remove('flex');
                screen.classList.add('hidden');
            }, 300);
        }

        function handleOverlayClick() {
            startNewGame();
        }

        /**
         * Pause/Resume Management
         */
        function togglePause() {
            if (!isRunning || isGameOver) return;

            isPaused = !isPaused;
            const pauseIcon = document.getElementById('pauseIcon');
            const pauseText = document.getElementById('pauseText');

            if (isPaused) {
                pauseIcon.className = "fa-solid fa-play";
                pauseText.innerText = "RESUME";
                showOverlay('PAUSED', 'Game is currently paused.', 'RESUME GAME', 'fa-pause text-yellow-400');
            } else {
                pauseIcon.className = "fa-solid fa-pause";
                pauseText.innerText = "PAUSE";
                hideOverlay();
            }
        }

        function resetGame() {
            startNewGame();
        }

        /**
         * Audio Toggle Settings
         */
        function toggleAudio() {
            AudioSystem.enabled = !AudioSystem.enabled;
            if (AudioSystem.enabled) AudioSystem.init();

            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');

            if (AudioSystem.enabled) {
                soundIcon.className = "fa-solid fa-volume-high";
                soundText.innerText = "AUDIO ON";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
                soundText.innerText = "MUTED";
            }
        }

        /**
         * User Movement Inputs (Keyboard & Mobile D-Pad)
         */
        function handleDirectionChange(newDir) {
            if (!isRunning || isPaused) return;

            // Prevent 180-degree instant reverse direction switch
            if (newDir.x === -dir.x && newDir.y === -dir.y) return;

            if (nextDir.x !== newDir.x || nextDir.y !== newDir.y) {
                AudioSystem.playTurnSound();
            }
            nextDir = newDir;
        }

        // Keyboard Controls Handler
        window.addEventListener('keydown', (e) => {
            // Audio System Context Initialization on User Interaction
            AudioSystem.init();

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    handleDirectionChange({ x: 0, y: -1 });
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    handleDirectionChange({ x: 0, y: 1 });
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    handleDirectionChange({ x: -1, y: 0 });
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    handleDirectionChange({ x: 1, y: 0 });
                    break;
                case ' ':
                    e.preventDefault();
                    togglePause();
                    break;
            }
        });

        // Mobile D-Pad Control Dispatcher
        function handleDpadInput(direction) {
            AudioSystem.init();
            switch (direction) {
                case 'UP':
                    handleDirectionChange({ x: 0, y: -1 });
                    break;
                case 'DOWN':
                    handleDirectionChange({ x: 0, y: 1 });
                    break;
                case 'LEFT':
                    handleDirectionChange({ x: -1, y: 0 });
                    break;
                case 'RIGHT':
                    handleDirectionChange({ x: 1, y: 0 });
                    break;
            }
        }
    </script>
</body>
</html>
